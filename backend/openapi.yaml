openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: >-
    Kontrak untuk route Tahap 3A dan 3B yang terdaftar di Express. Bentuk `data`
    mengikuti JSON dari RPC dan tidak menambahkan field yang tidak dijamin route.
servers:
  - url: /api
    description: Base API path
tags:
  - name: paket
    description: Pembacaan paket dan asosiasi scope survei
  - name: health
    description: Health operations
  - name: survei
    description: Sesi survei dan data segmen Tahap 3A
  - name: test-qa
    description: Operasi prototype TEST/QA; bukan aturan produksi/KAK
  - name: verval
    description: READ siklus Verval Tahap 3B dan CREATE siklus TEST/QA
  - name: correction
    description: Workflow Correction berbukti; RPC production masih default-off.
  - name: stage4-lrs
    description: Baca/simpan observasi validasi LRS; dikendalikan feature gate server.
security:
  - bearerAuth: []
paths:
  /paket/survey-scope:
    get:
      operationId: readPackageSurveyScope
      tags: [paket]
      summary: Baca asosiasi jenis survei yang teramati pada lokasi paket
      description: >-
        Paket kontrak belum menyimpan deklarasi scope survei. Endpoint ini
        membedakan declared_contract_scope (not_stored) dari asosiasi yang
        diamati pada lokasi_pekerjaan. Array asosiasi kosong tidak menyatakan
        scope kontrak kosong. Rekod tim, kalibrasi dan checklist tidak dibaca
        sebagai scope. Memerlukan akses paket sesuai RLS yang sudah berlaku;
        RPC read-only baca_scope_survei_paket harus tersedia di database.
        Otorisasi asosiasi mengikuti baca_ruas_paket (lebih sempit daripada
        package listing). Batch ditolak seluruhnya jika satu paket tidak
        diizinkan; UI kartu memanggil endpoint per paket agar penolakan satu
        kartu tidak mengganggu kartu lain.
      parameters:
        - in: query
          name: paket_ids
          required: true
          description: Daftar ID paket dipisah koma; maksimal 50, unik dan diurutkan server.
          schema:
            type: string
            example: "3,8,12"
      responses:
        "200":
          description: Setiap paket memiliki status availability dan sumber data eksplisit.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [paket_id, availability, declared_contract_scope, observed_location_associations]
                      properties:
                        paket_id:
                          type: integer
                        availability:
                          const: available
                        declared_contract_scope:
                          type: object
                          required: [availability, source, surveys]
                          properties:
                            availability:
                              const: not_stored
                            source:
                              const: paket_kontrak
                            surveys:
                              type: array
                              maxItems: 0
                        observed_location_associations:
                          type: object
                          required: [availability, source, observation_state, association_count, unresolved_association_count, surveys, associations]
                          properties:
                            availability:
                              const: available
                            source:
                              const: lokasi_pekerjaan
                            observation_state:
                              enum: [observed, none_observed]
                            association_count:
                              type: integer
                              minimum: 0
                            unresolved_association_count:
                              type: integer
                              minimum: 0
                            surveys:
                              type: array
                              items:
                                type: object
                                required: [jenis_survei_id, kode, nama, aktif]
                                properties:
                                  jenis_survei_id:
                                    type: integer
                                  kode:
                                    type: [string, "null"]
                                  nama:
                                    type: [string, "null"]
                                  aktif:
                                    type: [boolean, "null"]
                            associations:
                              type: array
                              items:
                                type: object
        "400":
          description: Paket IDs malformed or batch exceeds 50.
        "404":
          description: Paket tidak ditemukan atau tidak lolos visibilitas paket yang berlaku.
        "403":
          description: Salah satu asosiasi paket dalam batch berada di luar scope caller.
        "503":
          description: Candidate RPC is not installed or Supabase is unavailable.
        "502":
          description: RPC returned an incomplete or malformed response.
  /paket/{id}/scope-amendment:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: getPackageScopeAmendments
      tags: [paket]
      summary: Baca scope rasmi dan riwayat permohonan penambahan jenis survei
      description: >-
        Baca tanpa cache untuk Penyedia pemilik paket dan PIC Balai yang
        ditugaskan. Permohonan DIAJUKAN/DITOLAK tidak mengubah scope rasmi.
        Scope hanya berubah melalui keputusan PIC yang atomik dengan audit.
      responses:
        "200":
          description: Snapshot scope rasmi dan riwayat pindaan paket.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PackageScopeAmendmentState"
                additionalProperties: false
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: submitPackageScopeAmendment
      tags: [paket]
      summary: Ajukan satu atau lebih jenis survei tambahan kepada PIC
      description: >-
        Hanya Penyedia pemilik paket setelah Tahap 0 disetujui. Jenis survei
        yang sudah berada dalam scope resmi tidak boleh diajukan. Request tidak
        mengubah scope rasmi; maksimal satu permohonan menunggu keputusan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_scope_version, jenis_survei_ids]
              properties:
                expected_scope_version:
                  type: integer
                  minimum: 1
                  maximum: 2147483647
                jenis_survei_ids:
                  type: array
                  minItems: 1
                  maxItems: 50
                  uniqueItems: true
                  items: { type: integer, minimum: 1, maximum: 2147483647 }
              additionalProperties: false
      responses:
        "201":
          description: Permohonan tercatat; scope rasmi belum berubah.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PackageScopeAmendmentState"
                additionalProperties: false
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /paket/{id}/scope-amendment/{amendmentId}/review:
    parameters:
      - $ref: "#/components/parameters/PackageId"
      - name: amendmentId
        in: path
        required: true
        description: ID pindaan positif, maksimum integer 32-bit.
        schema: { type: string, pattern: "^[1-9][0-9]*$", maxLength: 10 }
    post:
      operationId: reviewPackageScopeAmendment
      tags: [paket]
      summary: Setujui atau tolak permohonan penambahan jenis survei
      description: >-
        Hanya PIC Balai berwenang. Versi permohonan wajib sesuai. Persetujuan
        juga mensyaratkan scope rasmi belum berubah sejak pengajuan; scope,
        keputusan, dan audit disimpan atomik.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_version, keputusan]
              properties:
                expected_version: { type: integer, minimum: 1, maximum: 2147483647 }
                keputusan: { type: string, enum: [DISETUJUI, DITOLAK] }
                catatan: { type: [string, "null"], maxLength: 2000 }
              allOf:
                - if:
                    properties:
                      keputusan: { const: DITOLAK }
                    required: [keputusan]
                  then:
                    required: [catatan]
                    properties:
                      catatan: { type: string, minLength: 1, maxLength: 2000 }
              additionalProperties: false
      responses:
        "200":
          description: Keputusan direkod dan status scope rasmi dibaca semula.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: "#/components/schemas/PackageScopeAmendmentState"
                additionalProperties: false
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /paket/{id}/tahap2-status:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: getStage2PackageCompletion
      tags: [paket]
      summary: Status kelulusan Tahap 2 terhadap scope survei rasmi paket
      description: >-
        Membaca scope rasmi paket melalui baca_scope_survei_kontrak dan senarai
        Uji Coba melalui ambil_senarai_uji_coba menggunakan identiti caller.
        Jenis survei dikira unik berdasarkan jenis_survei_id. Hanya status
        DISETUJUI yang dikembalikan oleh workflow review PIC memenuhi jenis itu;
        percubaan berulang bagi jenis sama tidak menambah kiraan. Scope kosong,
        belum ditetapkan, atau bacaan upstream tidak sah tidak dianggap selesai.
      responses:
        "200":
          description: Status Tahap 2 package-wide yang sama untuk Penyedia dan PIC.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [paket_id, state, approved_count, total_count, pending_surveys, reason, label]
                    properties:
                      paket_id: { type: integer, minimum: 1 }
                      state: { type: string, enum: [complete, partial, unavailable] }
                      approved_count: { type: [integer, "null"], minimum: 0 }
                      total_count: { type: [integer, "null"], minimum: 0 }
                      pending_surveys:
                        type: [array, "null"]
                        items:
                          type: object
                          required: [jenis_survei_id, kode, nama]
                          properties:
                            jenis_survei_id: { type: integer, minimum: 1 }
                            kode: { type: [string, "null"] }
                            nama: { type: [string, "null"] }
                      reason: { type: [string, "null"], enum: [DECLARED_SCOPE_UNSET, DECLARED_SCOPE_EMPTY, null] }
                      label: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /paket/{id}/validasi-lrs-capabilities:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: stage4LrsCapabilities
      tags: [stage4-lrs]
      summary: Kapabilitas Stage 4 LRS di environment ini
      responses:
        "200":
          description: Nilai `read` dan `write` keduanya mengikuti STAGE4_LRS_RPCS; tersedia false-by-default.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      read: { type: boolean }
                      write: { type: boolean }
                      reason: { type: [string, "null"] }
                    required: [read, write, reason]
                    additionalProperties: false
                required: [data]
                additionalProperties: false
        "401": { $ref: "#/components/responses/Unauthorized" }
  /paket/{id}/validasi-lrs-workflow-capabilities:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: stage4WorkflowCapabilities
      tags: [stage4-lrs]
      summary: Kapabilitas status, submit, dan review Stage 4
      responses:
        "200":
          description: Submit/review default-off melalui STAGE4_WORKFLOW_RPCS; status read mengikuti STAGE4_LRS_RPCS.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      status: { type: boolean }
                      submit: { type: boolean }
                      review: { type: boolean }
                      reason: { type: [string, "null"] }
                    required: [status, submit, review, reason]
                    additionalProperties: false
                required: [data]
                additionalProperties: false
        "401": { $ref: "#/components/responses/Unauthorized" }
  /paket/{id}/validasi-lrs-status:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: getStage4WorkflowStatus
      tags: [stage4-lrs]
      summary: Status Stage 4 server-backed tanpa evaluasi PASS/FAIL spekulatif
      description: >-
        Returns PENDING_RULES and progression_allowed=false while authoritative
        technical tolerances, document requirements, and PIC criteria are unresolved.
        No upload, submit, review, or subsequent-stage action is performed.
      responses:
        "200": { description: Status Stage 4 and persisted LRS rows in an envelope. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /paket/{id}/validasi-lrs/submit:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      operationId: submitStage4Lrs
      tags: [stage4-lrs]
      summary: Ajukan Stage 4 oleh Penyedia (default-off)
      description: Requires STAGE4_WORKFLOW_RPCS=true and the candidate ajukan_validasi_lrs RPC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_version: { type: integer, minimum: 0, maximum: 2147483646 }
              required: [expected_version]
              additionalProperties: false
      responses:
        "200": { description: Persisted submission lifecycle state. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /paket/{id}/validasi-lrs/review:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    post:
      operationId: reviewStage4Lrs
      tags: [stage4-lrs]
      summary: Keputusan review PIC Balai (default-off)
      description: Requires STAGE4_WORKFLOW_RPCS=true and candidate review_validasi_lrs RPC; revisi requires a note.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_version: { type: integer, minimum: 0, maximum: 2147483646 }
                keputusan: { type: string, enum: [PERLU_REVISI, DISETUJUI] }
                catatan: { type: string, maxLength: 2000 }
              required: [expected_version, keputusan, catatan]
              additionalProperties: false
      responses:
        "200": { description: Persisted review decision. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /paket/{id}/validasi-lrs:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: listStage4LrsValidations
      tags: [stage4-lrs]
      description: >-
        Calls public.baca_validasi_lrs(p_paket_id integer). Requires an authenticated
        authorized package user and STAGE4_LRS_RPCS=true. RPC returns a JSON array,
        empty when the package has no validation rows.
      responses:
        "200": { description: "Envelope data array containing persisted validation rows with versi." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /paket/{id}/validasi-lrs/{ruasId}:
    parameters:
      - $ref: "#/components/parameters/PackageId"
      - name: ruasId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    put:
      operationId: saveStage4LrsValidation
      tags: [stage4-lrs]
      description: >-
        Calls public.simpan_validasi_lrs(p_paket_id integer,p_ruas_id integer,
        p_expected_version integer,p_data jsonb); provider-only and feature-gated.
        The returned `data` is one persisted validation object. No deviation/status
        tolerance or approval is computed by this HTTP contract.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_version: { type: integer, minimum: 0, maximum: 2147483646 }
                panjang_lapangan_m: { type: number, minimum: 0 }
                panjang_acuan_m: { type: number, minimum: 0 }
                jumlah_error_topologi: { type: integer, minimum: 0 }
                format_sesuai_glossary: { type: boolean }
                sta_konsisten_iri_pci_ldt: { type: boolean }
              required: [expected_version, panjang_lapangan_m, panjang_acuan_m, jumlah_error_topologi, format_sesuai_glossary, sta_konsisten_iri_pci_ldt]
              additionalProperties: false
      responses:
        "200": { description: "Save RPC response envelope containing one persisted row in data." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /paket/{id}/koreksi-capabilities:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: correctionCapabilities
      tags: [correction]
      summary: Status kesiapan Correction server
      responses:
        "200": { description: Kapabilitas baca/tulis dan alasan disabled bila belum tersedia. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /paket/{id}/koreksi:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: listCorrections
      tags: [correction]
      description: Memerlukan kontrak baca Correction yang telah dipasang; default-off.
      responses:
        "200": { description: Daftar kasus koreksi dalam cakupan paket. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createCorrection
      tags: [correction]
      description: Hanya Penyedia Jasa; RPC tulis belum terpasang dan route default-off.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "201": { description: Kasus koreksi dibuat. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /paket/{id}/koreksi/{koreksiId}:
    parameters:
      - $ref: "#/components/parameters/PackageId"
      - name: koreksiId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    get:
      operationId: getCorrection
      tags: [correction]
      responses:
        "200": { description: Detail kasus, tindakan, verifikasi, keputusan tersimpan dan riwayat. }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /paket/{id}/koreksi/{koreksiId}/ajukan:
    parameters:
      - $ref: "#/components/parameters/PackageId"
      - name: koreksiId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: submitCorrectionForReview
      tags: [correction]
      description: Penyedia mengajukan; gunakan expected_version; default-off sampai RPC dipasang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: { expected_version: { type: integer, minimum: 0 } }
              required: [expected_version]
              additionalProperties: false
      responses:
        "201": { description: Pengajuan tercatat; GET detail berikutnya menjadi sumber kebenaran. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /paket/{id}/koreksi/{koreksiId}/review:
    parameters:
      - $ref: "#/components/parameters/PackageId"
      - name: koreksiId
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post:
      operationId: reviewCorrection
      tags: [correction]
      description: Hanya PIC Balai; keputusan persistent harus dibaca kembali; default-off.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_version: { type: integer, minimum: 0 }
                keputusan: { type: string, enum: [Disetujui, Perlu Revisi] }
                catatan: { type: string, maxLength: 2000 }
              required: [expected_version, keputusan, catatan]
              additionalProperties: false
      responses:
        "200": { description: Review tercatat; GET detail berikutnya menjadi sumber kebenaran. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    patch:
      operationId: updateCorrectionProposal
      tags: [correction]
      description: Memerlukan expected_version; route default-off sampai RPC terpasang.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_version: { type: integer, minimum: 0 }
                action_type: { type: string }
                evidence: { type: string }
              required: [expected_version]
              additionalProperties: false
      responses:
        "200": { description: Usulan berubah. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check (publik)
      description: Endpoint ini tidak memerlukan authentication.
      security: []
      responses:
        "200":
          description: Server sehat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /paket/{id}/sesi-survei:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: listSurveySessions
      tags: [survei]
      summary: Daftar sesi survei dalam paket
      responses:
        "200":
          description: Daftar hasil RPC, dibungkus dalam `data`.
          content:
            application/json:
              schema:
