        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /paket/{id}/siklus-verval/{siklusId}/uji-konsistensi:
    parameters:
      - $ref: "#/components/parameters/PackageId"
      - $ref: "#/components/parameters/CycleId"
    get:
      operationId: listVervalConsistencyChecks
      tags: [verval]
      summary: Daftar uji konsistensi untuk siklus Verval
      description: >-
        GET mengembalikan hasil tersimpan beserta pengulangan. POST menulis
        parent dan seluruh pengulangan secara atomik; memerlukan expected_version
        dan idempotency request_id. Kedua route tulis dinonaktifkan sampai RPC
        produksi diverifikasi di QA.
      responses:
        "200":
          description: Senarai hasil uji konsistensi dalam `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrayDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createVervalConsistency
      tags: [verval]
      summary: Simpan satu hasil konsistensi dan seluruh pengulangan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_id: { type: string, format: uuid }
                expected_version: { type: integer, minimum: 0 }
                jenis_survei_id: { type: integer, minimum: 1 }
                tim_id: { type: integer, minimum: 1 }
                ruas_id: { type: integer, minimum: 1 }
                sta_awal: { type: number, minimum: 0 }
                sta_akhir: { type: number, exclusiveMinimum: 0 }
                ulangan:
                  type: array
                  minItems: 1
                  maxItems: 20
                  items:
                    type: object
                    properties:
                      ulangan_ke: { type: integer, minimum: 1, maximum: 20 }
                      rater_personel_id: { type: integer, minimum: 1 }
                      nilai: { type: number }
                    required: [ulangan_ke, rater_personel_id, nilai]
                    additionalProperties: false
              required: [request_id, expected_version, jenis_survei_id, tim_id, ruas_id, sta_awal, sta_akhir, ulangan]
              additionalProperties: false
      responses:
        "201": { description: Hasil disimpan; `data` memuat parent, pengulangan dan versi. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Supabase access token dikirim sebagai Authorization: Bearer <token>."
  parameters:
    PackageId:
      name: id
      in: path
      required: true
      description: ID paket positif, maksimum integer 32-bit.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 10
    SessionId:
      name: sesiId
      in: path
      required: true
      description: ID sesi survei positif, maksimum integer 32-bit.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 10
    DataId:
      name: dataId
      in: path
      required: true
      description: ID data segmen positif dan safe integer JavaScript.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 16
    CycleId:
      name: siklusId
      in: path
      required: true
      description: ID siklus Verval positif, maksimum integer 32-bit.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 10
  schemas:
    PackageScopeSurvey:
      type: object
      required: [jenis_survei_id, kode, nama, aktif]
      properties:
        jenis_survei_id: { type: integer, minimum: 1 }
        kode: { type: [string, "null"] }
        nama: { type: [string, "null"] }
        aktif: { type: [boolean, "null"] }
      additionalProperties: false
    PackageScopeAmendment:
      type: object
      required:
        - pindaan_id
        - versi
        - expected_scope_version
        - status
        - skop_asal
        - tambahan_diminta
        - diajukan_oleh
        - diajukan_pada
        - direview_oleh
        - direview_pada
        - catatan_pic
        - versi_skop_diluluskan
      properties:
        pindaan_id: { type: integer, minimum: 1 }
        versi: { type: integer, minimum: 1 }
        expected_scope_version: { type: integer, minimum: 1 }
        status: { type: string, enum: [DIAJUKAN, DISETUJUI, DITOLAK] }
        skop_asal:
          type: array
          items: { $ref: "#/components/schemas/PackageScopeSurvey" }
        tambahan_diminta:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/PackageScopeSurvey" }
        diajukan_oleh: { type: integer, minimum: 1 }
        diajukan_pada: { type: string, format: date-time }
        direview_oleh: { type: [integer, "null"], minimum: 1 }
        direview_pada: { type: [string, "null"], format: date-time }
        catatan_pic: { type: [string, "null"], maxLength: 2000 }
        versi_skop_diluluskan: { type: [integer, "null"], minimum: 1 }
      additionalProperties: false
    PackageScopeAmendmentState:
      type: object
      required: [paket_id, scope_efektif, pindaan]
      properties:
        paket_id: { type: integer, minimum: 1 }
        scope_efektif:
          type: object
          required: [state, version, surveys]
          properties:
            state: { type: string, enum: [unset, defined] }
            version: { type: [integer, "null"], minimum: 1 }
            surveys:
              type: array
              items: { $ref: "#/components/schemas/PackageScopeSurvey" }
          additionalProperties: false
        pindaan:
          type: array
          items: { $ref: "#/components/schemas/PackageScopeAmendment" }
      additionalProperties: false
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          const: ok
      required: [status]
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: string
        details: {}
      required: [error]
      additionalProperties: true
    EmptyObject:
      type: object
      properties: {}
      additionalProperties: false
    ObjectDataEnvelope:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
      required: [data]
      additionalProperties: false
    ArrayDataEnvelope:
      type: object
      properties:
        data:
          type: array
          items: {}
      required: [data]
      additionalProperties: false
    PaginatedArrayDataEnvelope:
      type: object
      properties:
        data:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          const: 50
      required: [data, page, page_size]
      additionalProperties: false
    SurveySessionCreate:
      type: object
      properties:
        tim_id: { type: integer, minimum: 1, maximum: 2147483647 }
        ruas_id: { type: integer, minimum: 1, maximum: 2147483647 }
        alat_id: { type: integer, minimum: 1, maximum: 2147483647 }
        operator_id: { type: [integer, "null"], minimum: 1, maximum: 2147483647 }
        pengemudi_id: { type: [integer, "null"], minimum: 1, maximum: 2147483647 }
        tanggal:
          type: string
          format: date
          description: Tanggal kalender valid berformat YYYY-MM-DD.
        jam_mulai:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
        jam_selesai:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
        lajur: { type: [string, "null"], maxLength: 255 }
        arah: { type: [string, "null"], maxLength: 255 }
        cuaca: { type: [string, "null"], maxLength: 255 }
        kondisi_permukaan: { type: [string, "null"], maxLength: 255 }
        panjang_tercapai_km:
          type: [number, "null"]
          minimum: 0
        link_video: { type: [string, "null"], maxLength: 2000 }
      required: [tim_id, ruas_id, alat_id, tanggal]
      additionalProperties: false
    SurveySegmentCreate:
      type: object
      description: >-
        Selain jenis_survei_id, seluruh atribut opsional/null; sekurang-kurangnya
        satu atribut selain jenis_survei_id mesti mempunyai nilai bukan null.
      properties:
        jenis_survei_id: { type: integer, minimum: 1, maximum: 2147483647 }
        sta_awal: { type: [number, "null"] }
        sta_akhir: { type: [number, "null"] }
        lajur: { type: [string, "null"] }
        nilai_utama: { type: [number, "null"] }
        atribut_detail: {}
        lat: { type: [number, "null"] }
        lon: { type: [number, "null"] }
      required: [jenis_survei_id]
      additionalProperties: false
    DailyEquipmentCheckTestQaCreate:
      type: object
      properties:
        alat_id: { type: integer, minimum: 1, maximum: 2147483647 }
        tanggal: { type: string, format: date }
        item_pemeriksaan:
          type: string
          enum: [GPS, BATERAI, PENYIMPANAN, BOUNCE_TEST_KELAS_I]
          description: Enum prototype TEST/QA sahaja.
        hasil_pemeriksaan:
          type: string
          enum: [OK, BERMASALAH, TIDAK_DILAKUKAN]
          description: Catatan hasil prototype; bukan keputusan QA/QC.
        catatan: { type: [string, "null"], maxLength: 2000 }
      required: [alat_id, tanggal, item_pemeriksaan, hasil_pemeriksaan]
      additionalProperties: false
  responses:
    BadRequest:
      description: ID, query, body, atau format JSON tidak valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Bearer token tiada atau sesi tidak sah/tamat.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Profil, role, assignment, atau akses ditolak.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Paket, siklus, sesi, data segmen, atau rujukan tidak ditemukan/tidak terlihat.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Konflik unik atau prasyarat/transisi state ditolak RPC.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RequestTooLarge:
      description: Request melebihi limit JSON backend.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Kesalahan dalaman server.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: Permintaan kepada Supabase gagal.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Konfigurasi/upstream/RPC belum tersedia.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
