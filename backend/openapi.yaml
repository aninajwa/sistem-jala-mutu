openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: >-
    Kontrak untuk route Tahap 3A dan 3B yang terdaftar di Express. Bentuk `data`
    mengikuti JSON dari RPC dan tidak menambahkan field yang tidak dijamin route.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: admin
    description: Read-only Admin user listing
  - name: survei
    description: Sesi survei dan data segmen Tahap 3A
  - name: test-qa
    description: Operasi prototype TEST/QA; bukan aturan produksi/KAK
  - name: verval
    description: READ siklus Verval Tahap 3B dan CREATE siklus TEST/QA
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check (publik)
      description: Endpoint ini tidak memerlukan authentication.
      security: []
      responses:
        "200":
          description: Server sehat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: Daftar pengguna untuk Admin
      description: >-
        Memerlukan sesi terautentikasi dengan peran `admin`; validasi page,
        page_size dan pencarian username dilakukan server. Data dibaca melalui
        admin_daftar_pengguna dengan sesi pengguna terautentikasi.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: q
          in: query
          description: Pencarian username literal, case-insensitive; maksimum 100 karakter.
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Daftar pengguna hasil RPC read-only.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, page, page_size]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [pengguna_id, username, terkunci, peran]
                      properties:
                        pengguna_id: { type: integer }
                        username: { type: string }
                        terkunci: { type: boolean }
                        peran:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required: [nama, scope_balai_id, scope_paket_id]
                            properties:
                              nama: { type: string }
                              scope_balai_id: { type: [integer, "null"] }
                              scope_paket_id: { type: [integer, "null"] }
                  page: { type: integer }
                  page_size: { type: integer }
        "400":
          description: Parameter halaman atau pencarian tidak valid.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /admin/audit-trail:
    get:
      operationId: listAdminAuditTrail
      tags: [admin]
      summary: Daftar aman jejak aktivitas Admin
      description: >-
        Endpoint memerlukan Admin aktif dan memvalidasi pagination/pencarian.
        Endpoint memanggil RPC baca audit dengan sesi Supabase pemanggil.
        Nilai sebelum/sesudah dan record_id tidak pernah menjadi bagian respons.
      parameters:
        - name: page
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000000, default: 1 }
        - name: page_size
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: q
          in: query
          description: Cari ID aktor, tabel, atau aksi; maksimum 100 karakter.
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Daftar aman jejak aktivitas; waktu adalah timestamp tanpa zona waktu.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, page, page_size]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [trail_id, waktu, pengguna_id, tabel, aksi, ringkasan]
                      properties:
                        trail_id:
                          type: string
                          pattern: "^[0-9]+$"
                          description: PostgreSQL bigint encoded as decimal text to preserve precision in JavaScript clients.
                        waktu:
                          type: [string, "null"]
                          description: >-
                            Timestamp without time zone returned unchanged as a timezone-free
                            local timestamp string. Clients must not assume UTC or apply browser timezone conversion.
                        pengguna_id: { type: [integer, "null"] }
                        tabel: { type: string }
                        aksi: { type: string }
                        ringkasan: { type: string }
                  page: { type: integer }
                  page_size: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: Kontrak RPC baca audit aman belum tersedia.
          content:
            application/json:
              schema:
                type: object
                required: [code, error]
                properties:
                   code: { const: ADMIN_AUDIT_UNAVAILABLE }
                   error: { type: string }

  /admin/roles:
    get:
      operationId: listAdminAssignableRoles
      tags: [admin]
      summary: Katalog peran yang dapat ditugaskan Admin (implemented; disabled by default)
      description: >-
        Route aktual /admin/roles fail-closed kecuali server mengaktifkan
        ADMIN_ROLE_READS_ENABLED=true (atau ADMIN_ROLE_MANAGEMENT_ENABLED=true).
        Memerlukan Admin aktif. V1 hanya mengembalikan pic_balai dari katalog approved.
      responses:
        "200":
          description: Katalog peran yang diizinkan untuk assignment.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoleCatalogEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { description: Feature disabled atau RPC belum tersedia. }

  /admin/users/{pengguna_id}/roles:
    parameters:
      - name: pengguna_id
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 2147483647 }
    get:
      operationId: listAdminUserRoleAssignments
      tags: [admin]
      summary: Baca assignment peran dan versinya (implemented; disabled by default)
      description: >-
        Route diimplementasikan tetapi fail-closed kecuali server mengaktifkan
        ADMIN_ROLE_READS_ENABLED=true (atau ADMIN_ROLE_MANAGEMENT_ENABLED=true) dan RPC terpasang. mutation_version
        berupa teks desimal. Panggilan menggunakan JWT pemanggil, bukan service-role.
      responses:
        "200":
          description: Assignment untuk target user; daftar kosong jika belum memiliki peran.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminUserRoleAssignmentsEnvelope" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503":
          description: Feature disabled atau RPC assignment list belum tersedia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    post:
      operationId: addAdminUserRoleAssignment
      tags: [admin]
      summary: Tambah assignment peran (implemented; disabled by default)
      description: >-
        Fail-closed kecuali ADMIN_ROLE_MANAGEMENT_ENABLED=true. Memerlukan Admin aktif.
        Server memilih peran_id pic_balai dari katalog; body hanya berisi scope.
        V1 menolak role selain pic_balai dan semua self-change. Target terkunci ditolak
        untuk tambah/ubah. Audit ditulis dalam transaksi yang sama. Balai harus aktif;
        paket opsional harus berasal dari Balai itu.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRoleAssignmentCreate" }
      responses:
        "201":
          description: Assignment dibuat dan dicatat pada audit_trail.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoleAssignmentEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { description: Feature disabled atau RPC belum tersedia. }

  /admin/users/{pengguna_id}/roles/{pp_id}:
    parameters:
      - name: pengguna_id
        in: path
        required: true
        schema: { type: integer, minimum: 1, maximum: 2147483647 }
      - name: pp_id
        in: path
        required: true
        description: Primary key assignment pada public.pengguna_peran.
        schema: { type: integer, minimum: 1, maximum: 2147483647 }
    patch:
      operationId: changeAdminUserRoleScope
      tags: [admin]
      summary: Ubah scope assignment tanpa mengubah role (implemented; disabled by default)
      description: >-
        Wajib If-Match dari mutation_version saat ini. Role ID immutable pada operasi
        ini; V1 hanya mendukung pic_balai, bukan self-change, serta menolak target
        terkunci. Audit dan update atomik; scope divalidasi terhadap Balai aktif dan
        relasi paket/Balai.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
          description: ETag kuat berupa mutation_version desimal dari GET role assignments.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminRoleScopeChange" }
      responses:
        "200":
          description: Scope berhasil diubah; data memuat version baru.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminRoleAssignmentEnvelope" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { description: Feature disabled atau RPC belum tersedia. }
    delete:
      operationId: revokeAdminUserRoleAssignment
      tags: [admin]
      summary: Cabut assignment peran (implemented; disabled by default)
      description: >-
        Wajib If-Match dari mutation_version saat ini. V1 hanya mengizinkan pencabutan
        assignment pic_balai milik pengguna lain; role Admin dan role lain ditolak.
        Respons sukses 204 tanpa body.
      parameters:
        - name: If-Match
          in: header
          required: true
          schema: { type: string, pattern: '^"[1-9][0-9]*"$' }
      responses:
        "204": { description: Assignment dicabut dan diaudit dalam transaksi yang sama. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { description: Feature disabled atau RPC belum tersedia. }

  /paket/{id}/sesi-survei:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: listSurveySessions
      tags: [survei]
      summary: Daftar sesi survei dalam paket
      responses:
        "200":
          description: Daftar hasil RPC, dibungkus dalam `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrayDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createSurveySession
      tags: [survei]
      summary: Catat sesi survei
      description: Hanya role `penyedia_jasa`; relasi/persetujuan prasyarat divalidasi RPC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveySessionCreate"
      responses:
        "201":
          description: Sesi berhasil dicatat; `data` berisi hasil RPC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /paket/{id}/sesi-survei/{sesiId}:
    parameters:
      - $ref: "#/components/parameters/PackageId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: getSurveySession
      tags: [survei]
      summary: Detail sesi survei
      responses:
        "200":
          description: Satu sesi dalam `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /paket/{id}/sesi-survei/{sesiId}/data-segmen:
    parameters:
      - $ref: "#/components/parameters/PackageId"
      - $ref: "#/components/parameters/SessionId"
    get:
      operationId: listSurveySegments
      tags: [survei]
      summary: Daftar data segmen untuk sesi
      responses:
        "200":
          description: Daftar hasil RPC dalam `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrayDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createSurveySegment
      tags: [survei]
      summary: Catat data segmen
      description: Hanya role `penyedia_jasa`; paket, sesi dan relasi rujukan diperiksa di RPC.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SurveySegmentCreate"
      responses:
        "201":
          description: Data segmen berhasil dicatat; `data` berisi hasil RPC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /paket/{id}/sesi-survei/{sesiId}/data-segmen/{dataId}:
    parameters:
      - $ref: "#/components/parameters/PackageId"
      - $ref: "#/components/parameters/SessionId"
      - $ref: "#/components/parameters/DataId"
    get:
      operationId: getSurveySegment
      tags: [survei]
      summary: Detail data segmen dalam sesi
      responses:
        "200":
          description: Satu data segmen dalam `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /paket/{id}/pemeriksaan-harian-alat:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: listDailyEquipmentChecksTestQa
      tags: [test-qa]
      summary: Daftar pemeriksaan harian alat (TEST/QA prototype)
      description: Endpoint prototype; enum dan perilakunya bukan ketentuan KAK/produksi yang disahkan.
      parameters:
        - name: page
          in: query
          required: false
          description: Halaman 1-based; default 1, maksimum 1000000. Setiap halaman berukuran 50.
          schema:
            type: integer
            minimum: 1
            maximum: 1000000
            default: 1
      responses:
        "200":
          description: Hasil berhalaman; `data` ialah senarai rekod.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedArrayDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createDailyEquipmentCheckTestQa
      tags: [test-qa]
      summary: Catat pemeriksaan harian alat (TEST/QA prototype)
      description: >-
        Hanya role `penyedia_jasa`. Endpoint prototype TEST/QA; enum pemeriksaan
        dan hasil bukan standard KAK yang disahkan. Validasi hubungan paket/alat
        dilakukan RPC prototype; ketersediaan fungsi database tetap diperlukan.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyEquipmentCheckTestQaCreate"
      responses:
        "201":
          description: Rekod prototype dibuat; `data` berisi hasil RPC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /paket/{id}/siklus-verval:
    parameters:
      - $ref: "#/components/parameters/PackageId"
    get:
      operationId: listVervalCycles
      tags: [verval]
      summary: Daftar siklus Verval
      responses:
        "200":
          description: Senarai siklus dalam `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrayDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    post:
      operationId: createFirstVervalCycleTestQa
      tags: [verval, test-qa]
      summary: CREATE siklus pertama (TEST/QA allowlist)
      description: >-
        Route aktif hanya untuk RPC `buat_siklus_verval_testqa`. Payload body
        mesti kosong (jika dikirim); CREATE dibatasi oleh role/ownership dan
        TEST/QA allowlist database aktif. Dokumentasi ini tidak menyatakan paket tertentu
        telah di-allowlist. Bukan CREATE siklus produksi umum.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmptyObject"
      responses:
        "201":
          description: Siklus dibuat; `data` berisi hasil RPC.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/RequestTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /paket/{id}/siklus-verval/{siklusId}:
    parameters:
      - $ref: "#/components/parameters/PackageId"
      - $ref: "#/components/parameters/CycleId"
    get:
      operationId: getVervalCycle
      tags: [verval]
      summary: Detail siklus Verval
      responses:
        "200":
          description: Satu objek siklus dalam `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ObjectDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /paket/{id}/siklus-verval/{siklusId}/uji-konsistensi:
    parameters:
      - $ref: "#/components/parameters/PackageId"
      - $ref: "#/components/parameters/CycleId"
    get:
      operationId: listVervalConsistencyChecks
      tags: [verval]
      summary: Daftar uji konsistensi untuk siklus Verval
      description: READ sahaja. Tiada POST uji konsistensi yang didaftarkan.
      responses:
        "200":
          description: Senarai hasil uji konsistensi dalam `data`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArrayDataEnvelope"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
        "502": { $ref: "#/components/responses/UpstreamError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "Supabase access token dikirim sebagai Authorization: Bearer <token>."
  parameters:
    PackageId:
      name: id
      in: path
      required: true
      description: ID paket positif, maksimum integer 32-bit.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 10
    SessionId:
      name: sesiId
      in: path
      required: true
      description: ID sesi survei positif, maksimum integer 32-bit.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 10
    DataId:
      name: dataId
      in: path
      required: true
      description: ID data segmen positif dan safe integer JavaScript.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 16
    CycleId:
      name: siklusId
      in: path
      required: true
      description: ID siklus Verval positif, maksimum integer 32-bit.
      schema:
        type: string
        pattern: "^[1-9][0-9]*$"
        maxLength: 10
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
          const: ok
      required: [status]
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details: {}
      required: [error]
      additionalProperties: true
    AdminRoleCatalogEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminAssignableRole" }
      required: [data]
      additionalProperties: false
    AdminAssignableRole:
      type: object
      properties:
        peran_id: { type: integer, minimum: 1 }
        nama_peran: { type: string }
      required: [peran_id, nama_peran]
      additionalProperties: false
    AdminRoleAssignmentsEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminRoleAssignment" }
      required: [data]
      additionalProperties: false
    AdminUserRoleAssignmentsEnvelope:
      type: object
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/AdminUserRoleAssignment" }
      required: [data]
      additionalProperties: false
    AdminUserRoleAssignment:
      type: object
      properties:
        pp_id: { type: integer, minimum: 1 }
        pengguna_id: { type: integer, minimum: 1 }
        peran_id: { type: integer, minimum: 1 }
        nama_peran: { type: string }
        scope_balai_id: { type: [integer, "null"], minimum: 1 }
        scope_paket_id: { type: [integer, "null"], minimum: 1 }
        mutation_version:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Bigint mutation version returned as decimal text; never coerce to JS number.
      required: [pp_id, pengguna_id, peran_id, nama_peran, scope_balai_id, scope_paket_id, mutation_version]
      additionalProperties: false
    AdminRoleAssignmentEnvelope:
      type: object
      properties:
        data: { $ref: "#/components/schemas/AdminRoleAssignment" }
      required: [data]
      additionalProperties: false
    AdminRoleAssignment:
      type: object
      properties:
        pp_id: { type: integer, minimum: 1 }
        pengguna_id: { type: integer, minimum: 1 }
        peran_id: { type: integer, minimum: 1 }
        nama_peran: { type: string }
        scope_balai_id: { type: [integer, "null"], minimum: 1 }
        scope_paket_id: { type: [integer, "null"], minimum: 1 }
        mutation_version:
          type: string
          pattern: "^[1-9][0-9]*$"
          description: Bigint revision decimal string; gunakan sebagai ETag If-Match tanpa konversi angka.
      required: [pp_id, pengguna_id, peran_id, nama_peran, scope_balai_id, scope_paket_id, mutation_version]
      additionalProperties: false
    AdminRoleAssignmentCreate:
      type: object
      properties:
        scope_balai_id: { type: integer, minimum: 1, maximum: 2147483647 }
        scope_paket_id: { type: [integer, "null"], minimum: 1, maximum: 2147483647 }
      required: [scope_balai_id, scope_paket_id]
      additionalProperties: false
    AdminRoleScopeChange:
      type: object
      properties:
        scope_balai_id: { type: integer, minimum: 1, maximum: 2147483647 }
        scope_paket_id: { type: [integer, "null"], minimum: 1, maximum: 2147483647 }
      required: [scope_balai_id, scope_paket_id]
      additionalProperties: false
    EmptyObject:
      type: object
      properties: {}
      additionalProperties: false
    ObjectDataEnvelope:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
      required: [data]
      additionalProperties: false
    ArrayDataEnvelope:
      type: object
      properties:
        data:
          type: array
          items: {}
      required: [data]
      additionalProperties: false
    PaginatedArrayDataEnvelope:
      type: object
      properties:
        data:
          type: array
          items: {}
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          const: 50
      required: [data, page, page_size]
      additionalProperties: false
    SurveySessionCreate:
      type: object
      properties:
        tim_id: { type: integer, minimum: 1, maximum: 2147483647 }
        ruas_id: { type: integer, minimum: 1, maximum: 2147483647 }
        alat_id: { type: integer, minimum: 1, maximum: 2147483647 }
        operator_id: { type: [integer, "null"], minimum: 1, maximum: 2147483647 }
        pengemudi_id: { type: [integer, "null"], minimum: 1, maximum: 2147483647 }
        tanggal:
          type: string
          format: date
          description: Tanggal kalender valid berformat YYYY-MM-DD.
        jam_mulai:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
        jam_selesai:
          type: [string, "null"]
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9](:[0-5][0-9])?$"
        lajur: { type: [string, "null"], maxLength: 255 }
        arah: { type: [string, "null"], maxLength: 255 }
        cuaca: { type: [string, "null"], maxLength: 255 }
        kondisi_permukaan: { type: [string, "null"], maxLength: 255 }
        panjang_tercapai_km:
          type: [number, "null"]
          minimum: 0
        link_video: { type: [string, "null"], maxLength: 2000 }
      required: [tim_id, ruas_id, alat_id, tanggal]
      additionalProperties: false
    SurveySegmentCreate:
      type: object
      description: >-
        Selain jenis_survei_id, seluruh atribut opsional/null; sekurang-kurangnya
        satu atribut selain jenis_survei_id mesti mempunyai nilai bukan null.
      properties:
        jenis_survei_id: { type: integer, minimum: 1, maximum: 2147483647 }
        sta_awal: { type: [number, "null"] }
        sta_akhir: { type: [number, "null"] }
        lajur: { type: [string, "null"] }
        nilai_utama: { type: [number, "null"] }
        atribut_detail: {}
        lat: { type: [number, "null"] }
        lon: { type: [number, "null"] }
      required: [jenis_survei_id]
      additionalProperties: false
    DailyEquipmentCheckTestQaCreate:
      type: object
      properties:
        alat_id: { type: integer, minimum: 1, maximum: 2147483647 }
        tanggal: { type: string, format: date }
        item_pemeriksaan:
          type: string
          enum: [GPS, BATERAI, PENYIMPANAN, BOUNCE_TEST_KELAS_I]
          description: Enum prototype TEST/QA sahaja.
        hasil_pemeriksaan:
          type: string
          enum: [OK, BERMASALAH, TIDAK_DILAKUKAN]
          description: Catatan hasil prototype; bukan keputusan QA/QC.
        catatan: { type: [string, "null"], maxLength: 2000 }
      required: [alat_id, tanggal, item_pemeriksaan, hasil_pemeriksaan]
      additionalProperties: false
  responses:
    BadRequest:
      description: ID, query, body, atau format JSON tidak valid.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Bearer token tiada atau sesi tidak sah/tamat.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Profil, role, assignment, atau akses ditolak.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Paket, siklus, sesi, data segmen, atau rujukan tidak ditemukan/tidak terlihat.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Konflik unik atau prasyarat/transisi state ditolak RPC.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RequestTooLarge:
      description: Request melebihi limit JSON backend.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InternalError:
      description: Kesalahan dalaman server.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UpstreamError:
      description: Permintaan kepada Supabase gagal.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServiceUnavailable:
      description: Konfigurasi/upstream/RPC belum tersedia.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
